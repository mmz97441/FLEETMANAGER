name: CI

# Vérifie à chaque push / pull request que le code compile (typecheck) et
# que le build de production passe. Empêche les régressions et les bugs
# silencieux (fonction inexistante, mauvais champ, etc.) d'atteindre la prod.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (vite)
        run: npm run build
